name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install root dependencies
        run: npm ci

      - name: Run backend tests
        run: npm test

      - name: Install web dependencies
        run: cd web && npm install

      - name: Run web tests
        run: cd web && npm test

      - name: Build web app
        run: npm run build:web

      - name: Drift guard - check public/app is up to date
        run: |
          if ! git diff --exit-code public/app; then
            echo "::error::public/app is out of date with web/ sources."
            echo "The committed build in public/app does not match a fresh build."
            echo "Run 'npm run build:web' from the repo root and commit the regenerated public/app/."
            exit 1
          fi
